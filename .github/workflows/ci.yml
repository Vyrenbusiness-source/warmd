name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=error --shell=bash bin/warmd lib/*.sh adapters/*.sh install.sh tests/run.sh

  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public benchmark, numbers appear in the job summary
        run: bash tests/proof.sh | tee -a "$GITHUB_STEP_SUMMARY"

  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip -d "$HOME/godot"
          echo "WARMD_GODOT=$HOME/godot/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - run: bash tests/godot.sh
