name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The self-test runs as parallel jobs, one per group. Groups are balanced by the "time <suite>" lines of tests/run.sh,
  # bash tests/run.sh --guard (shellcheck job) fails when a suite is in no group or in two.
  self-test:
    name: self-test (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group:
          - generic
          - perf ship docs digest install
          - team tune map ledger bgwait
          - core
          - hook bars gain daemon
          - auto affected brakes audit unity slim layout
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run.sh ${{ matrix.group }}

  shellcheck:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          curl -fsSL -o sc.zip https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.zip
          unzip -q sc.zip -d "$HOME/sc"
      - run: '"$HOME/sc/shellcheck.exe" --severity=error --shell=bash bin/warmd lib/*.sh adapters/*.sh install.sh tests/run.sh tests/tune.sh tests/install.sh'
      - name: Every self-test suite is in exactly one group
        run: bash tests/run.sh --guard

  proof:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Public benchmark, numbers appear in the job summary
        run: bash tests/proof.sh | tee -a "$GITHUB_STEP_SUMMARY"

  godot:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_win64.exe.zip
          unzip -q godot.zip -d "$HOME/godot"
          echo "WARMD_GODOT=$HOME/godot/Godot_v4.4.1-stable_win64_console.exe" >> "$GITHUB_ENV"
      - run: bash tests/godot.sh

  plugin:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: The marketplace and the plugin pass the official validator
        run: claude plugin validate .
