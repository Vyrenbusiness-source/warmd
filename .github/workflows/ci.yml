name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Path diagnostics for the hook tests
        run: |
          echo "TEMP=$TEMP TMP=$TMP TMPDIR=${TMPDIR:-unset}"; d="$(mktemp -d)"; echo "mktemp=$d pwd=$(cd "$d" && pwd -W)"
          cd "$d" && git init -q -b main . && echo "toplevel=$(git rev-parse --show-toplevel) common=$(git rev-parse --path-format=absolute --git-common-dir)"
          git -c user.name=t -c user.email=t@e commit -q --allow-empty -m i && git worktree add -q "$d/wt" -b w1 && git worktree list --porcelain | grep '^worktree'
          cd "$d/wt" && echo "wt toplevel=$(git rev-parse --show-toplevel) cygpath -l=$(cygpath -l -m "$d/wt")"
      - run: bash tests/run.sh
      - run: bash tests/tune.sh

  shellcheck:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          curl -fsSL -o sc.zip https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.zip
          unzip -q sc.zip -d "$HOME/sc"
      - run: '"$HOME/sc/shellcheck.exe" --severity=error --shell=bash bin/warmd lib/*.sh adapters/*.sh install.sh tests/run.sh tests/tune.sh'

  proof:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Public benchmark, numbers appear in the job summary
        run: bash tests/proof.sh | tee -a "$GITHUB_STEP_SUMMARY"

  godot:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_win64.exe.zip
          unzip -q godot.zip -d "$HOME/godot"
          echo "WARMD_GODOT=$HOME/godot/Godot_v4.4.1-stable_win64_console.exe" >> "$GITHUB_ENV"
      - run: bash tests/godot.sh
