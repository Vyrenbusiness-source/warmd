<!doctype html>
<!-- README hero. The terminal is the real session in hero.log (captured with warmd on a throwaway Node project), lines copied unchanged,
     only the comment line between the runs and the elision mark are added. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css"><style>
html,body{width:800px;height:470px}
body{padding:30px 34px 0}
.stripe{position:absolute;left:0;right:0;top:0}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.mark{font-size:58px;line-height:.9}
.top .label{text-align:right;line-height:1.7;margin-top:4px}
h1{font:600 31px/1.1 Bahnschrift,"Segoe UI",sans-serif;letter-spacing:-.01em;margin:16px 0 20px}
h1 em{font-style:normal;color:var(--heat)}
.term{background:var(--term);color:var(--tink);border:1px solid var(--trule);position:relative}
.bar{height:28px;border-bottom:1px solid var(--trule);display:flex;align-items:center;justify-content:space-between;padding:0 14px;
  font:11px "Cascadia Mono",Consolas,monospace;letter-spacing:.08em;color:var(--tmute);text-transform:uppercase}
.bar i{display:inline-block;width:8px;height:8px;background:var(--heat);margin-right:8px}
pre{padding:12px 16px 14px;font-size:13px;line-height:1.55;white-space:pre}
.p{color:#ff8a66}.c{color:var(--tmute)}.ok{color:#6fd99a;font-weight:700}.no{color:#ff7a6e;font-weight:700}.add{color:#6fd99a}.del{color:#ff7a6e}.dim{color:var(--tmute)}
</style></head><body>
<div class="stripe"></div>
<div class="top"><div class="mark">warmd<i></i></div><div class="label">engine-side helper<br>for coding agents</div></div>
<h1>Your coding agent <em>waits less</em> and <em>reads less</em>.</h1>
<div class="term"><div class="bar"><span><i></i>Git Bash &middot; C:/dev/cart-demo</span><span>real session, see hero.log</span></div>
<pre>TERMINAL</pre></div>
</body></html>
